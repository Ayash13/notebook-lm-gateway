version: '3.8'

services:
  nlm-gateway:
    image: ayash13/notebook-lm-gateway:latest
    container_name: nlm-gateway
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - MAX_SESSIONS=5
    secrets:
      - auth_state
    volumes:
      - nlm-data:/app/data
    restart: unless-stopped

secrets:
  auth_state:
    file: ./auth-state.json

volumes:
  nlm-data: