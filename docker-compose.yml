services:
  gateway:
    image: ayash13/notebook-lm-gateway:latest
    ports:
      - "3005:3005"
    volumes:
      - nlm-gateway-db-fresh:/app/data
    env_file:
      - .env
    environment:
      - PORT=3005
      - DB_DIR=/app/data
      - MAX_SESSIONS=${MAX_SESSIONS:-5}
    restart: unless-stopped

volumes:
  nlm-gateway-db-fresh:
    name: nlm-gateway-db-fresh
